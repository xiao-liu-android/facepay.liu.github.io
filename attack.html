<!DOCTYPE html>
<html>
<body>
<h1>PoC Page</h1>
<script>
navigator.geolocation.getCurrentPosition(
    function(pos) {
        document.body.innerHTML += '<p style="color:red">LAT: ' + pos.coords.latitude + 
            ' LNG: ' + pos.coords.longitude + '</p>';
    },
    function(err) {
        document.body.innerHTML += '<p>Error: ' + err.message + ' (code=' + err.code + ')</p>';
    }
);
</script>
</body>
</html>
